services:
    postgres:
        image: postgres:16-alpine
        container_name: docplatform_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - docplatform

    redis:
        image: redis:7-alpine
        container_name: docplatform_redis
        restart: unless-stopped
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - docplatform

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
            target: production
        container_name: docplatform_backend
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3000
            DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            JWT_SECRET: ${JWT_SECRET}
            JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
            JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
            JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
            GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
            STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
            UPLOAD_DIR: ./uploads
            AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
            AWS_REGION: ${AWS_REGION:-}
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-587}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_PASSWORD: ${SMTP_PASSWORD:-}
            SMTP_FROM: ${SMTP_FROM:-noreply@docplatform.com}
            FRONTEND_URL: ${FRONTEND_URL}
            PADDLE_API_KEY: ${PADDLE_API_KEY:-}
            PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
            PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - backend_uploads:/app/uploads
        networks:
            - docplatform

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            target: production
            args:
                VITE_SITE_URL: https://${DOMAIN:-localhost}
                VITE_PADDLE_CLIENT_TOKEN: ${VITE_PADDLE_CLIENT_TOKEN:-}
                VITE_PADDLE_ENVIRONMENT: ${VITE_PADDLE_ENVIRONMENT:-sandbox}
        container_name: docplatform_frontend
        restart: unless-stopped
        depends_on:
            - backend
        networks:
            - docplatform

    caddy:
        image: caddy:2-alpine
        container_name: docplatform_caddy
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        environment:
            DOMAIN: ${DOMAIN:-localhost}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - frontend
            - backend
        networks:
            - docplatform

networks:
    docplatform:
        driver: bridge

volumes:
    postgres_data:
    redis_data:
    backend_uploads:
    caddy_data:
    caddy_config:
